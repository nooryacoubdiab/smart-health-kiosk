<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard — Smart Health Kiosk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
            --ink: #16261F;
            --paper: #F3F1E9;
            --paper-2: #EAE7DB;
            --teal-deep: #0B4A3C;
            --teal: #146B54;
            --teal-light: #BFE0D2;
            --coral: #C1442E;
            --coral-light: #F3D9D2;
            --serif: 'Fraunces', Georgia, serif;
            --sans: 'IBM Plex Sans', -apple-system, sans-serif;
            --mono: 'IBM Plex Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            min-height: 100vh;
        }

        header {
            background: var(--teal-deep);
            color: var(--paper);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .brand {
            font-family: var(--serif);
            font-weight: 500;
            font-size: 19px;
        }

        header .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header .clock {
            font-family: var(--mono);
            font-size: 13px;
            opacity: 0.85;
        }

        .stats-link {
            color: var(--paper);
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .stats-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .alerts-bar {
            background: var(--coral);
            color: #fff;
            padding: 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height .3s ease;
        }

        .alerts-bar.show {
            max-height: 300px;
        }

        .alerts-inner {
            padding: 14px 28px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .alerts-inner .icon {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .alert-chip {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .alert-chip b {
            font-family: var(--mono);
        }

        .ack-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 4px;
            font-family: var(--sans);
        }

        .ack-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .layout {
            display: grid;
            grid-template-columns: 270px 1fr;
            min-height: calc(100vh - 62px);
        }

        .sidebar {
            background: #fff;
            border-right: 1px solid var(--paper-2);
            padding: 20px 0;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8A9B92;
            padding: 0 20px 10px;
            font-family: var(--mono);
        }

        .dept-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background .15s, border-color .15s;
        }

        .dept-item:hover {
            background: var(--paper);
        }

        .dept-item.active {
            background: var(--teal-light);
            border-left-color: var(--teal-deep);
        }

        .dept-name {
            font-size: 14px;
            font-weight: 500;
        }

        .dept-count {
            font-family: var(--mono);
            font-size: 12px;
            background: var(--paper-2);
            color: var(--ink);
            border-radius: 12px;
            padding: 2px 9px;
            min-width: 20px;
            text-align: center;
        }

        .dept-item.active .dept-count {
            background: var(--teal-deep);
            color: var(--paper);
        }

        .dept-count.zero {
            opacity: 0.4;
        }

        .main {
            padding: 32px 36px;
        }

        .main-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .main-head h1 {
            font-family: var(--serif);
            font-weight: 500;
            font-size: 26px;
        }

        .main-head .wait-badge {
            font-family: var(--mono);
            font-size: 12px;
            color: #5C6960;
        }

        .queue-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .queue-col h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: var(--mono);
        }

        .queue-col.priority h2 {
            background: var(--coral-light);
            color: #8C3320;
        }

        .queue-col.standard h2 {
            background: var(--teal-light);
            color: var(--teal-deep);
        }

        .ticket-row {
            background: #fff;
            border: 1px solid var(--paper-2);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .ticket-row .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ticket-no {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 14px;
            color: var(--teal-deep);
        }

        .patient-name {
            font-size: 13.5px;
        }

        .patient-age {
            font-size: 12px;
            color: #8A9B92;
        }

        .wait-est {
            font-family: var(--mono);
            font-size: 12px;
            color: #8A9B92;
        }

        .call-btn {
            background: var(--teal-deep);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: var(--sans);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .call-btn:hover {
            background: var(--teal);
        }

        .empty-state {
            color: #8A9B92;
            font-size: 13.5px;
            padding: 20px;
            text-align: center;
            background: #fff;
            border: 1px dashed var(--paper-2);
            border-radius: 10px;
        }

        .predict-box {
            margin-top: 28px;
            background: #fff;
            border: 1px solid var(--paper-2);
            border-radius: 10px;
            padding: 16px 18px;
            font-size: 13.5px;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .predict-box .label {
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            color: #8A9B92;
        }

        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--paper);
            font-size: 12px;
            font-family: var(--mono);
        }
    </style>
</head>

<body>

    <header>
        <span class="brand">Smart Health Kiosk — Staff Dashboard</span>
        <div class="right">
            <label class="voice-toggle"><input type="checkbox" id="voiceToggle" checked> 🔊 Voice calls (EN +
                AR)</label>
            <a class="stats-link" href="/stats.html">📊 Ministry Stats</a>
            <span class="clock" id="clock"></span>
        </div>
    </header>

    <div class="alerts-bar" id="alertsBar">
        <div class="alerts-inner">
            <span class="icon">⚠ Emergency</span>
            <div id="alertsList" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <div class="layout">
        <div class="sidebar">
            <h3>Departments</h3>
            <div id="deptList"></div>
        </div>

        <div class="main">
            <div class="main-head">
                <h1 id="deptTitle">General</h1>
                <span class="wait-badge" id="waitBadge"></span>
            </div>

            <div class="queue-cols">
                <div class="queue-col priority">
                    <h2>Priority</h2>
                    <div id="priorityList"></div>
                </div>
                <div class="queue-col standard">
                    <h2>Standard</h2>
                    <div id="standardList"></div>
                </div>
            </div>

            <div class="predict-box" id="predictBox">Loading peak-hour forecast…</div>
        </div>
    </div>

    <script>
        const DEPT_LABELS_EN = {
            general: 'General', beds: 'Beds and Admission', dental: 'Dental', maternity: 'Maternity',
            labs: 'Laboratories', radiology: 'Radiology', pharmacy: 'Pharmacy', internal: 'Internal Medicine',
            chest: 'Chest and Pulmonary', ent: 'E N T'
        };
        const DEPT_LABELS_AR = {
            general: 'عام', beds: 'أسرة', dental: 'أسنان', maternity: 'أمومة',
            labs: 'المختبرات', radiology: 'الأشعة', pharmacy: 'الصيدلية', internal: 'الباطنية',
            chest: 'الصدرية', ent: 'أنف أذن حنجرة'
        };

        let departments = [];
        let activeDept = 'general';
        let allQueueData = [];

        function tickClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        tickClock(); setInterval(tickClock, 1000);

        async function loadDepartments() {
            const res = await fetch('/api/departments');
            const data = await res.json();
            departments = data.departments;
            renderSidebar();
        }

        function renderSidebar() {
            const el = document.getElementById('deptList');
            el.innerHTML = departments.map(code => {
                const count = allQueueData.filter(q => q.department === code).length;
                return `
      <div class="dept-item ${code === activeDept ? 'active' : ''}" onclick="selectDept('${code}')">
        <span class="dept-name">${DEPT_LABELS_EN[code] || code}</span>
        <span class="dept-count ${count === 0 ? 'zero' : ''}">${count}</span>
      </div>`;
            }).join('');
        }

        function selectDept(code) {
            activeDept = code;
            document.getElementById('deptTitle').textContent = DEPT_LABELS_EN[code] || code;
            renderSidebar();
            renderQueueForActiveDept();
        }

        async function loadQueue() {
            const res = await fetch('/api/queue');
            allQueueData = await res.json();
            renderSidebar();
            renderQueueForActiveDept();
        }

        function renderQueueForActiveDept() {
            const rows = allQueueData.filter(q => q.department === activeDept);
            const priority = rows.filter(r => r.queue_type === 'priority');
            const standard = rows.filter(r => r.queue_type === 'standard');

            document.getElementById('priorityList').innerHTML = priority.length
                ? priority.map(rowHtml).join('')
                : `<div class="empty-state">No priority patients waiting</div>`;

            document.getElementById('standardList').innerHTML = standard.length
                ? standard.map((r, i) => rowHtml(r, priority.length + i)).join('')
                : `<div class="empty-state">No standard patients waiting</div>`;

            document.getElementById('waitBadge').textContent = `${rows.length} waiting`;
        }

        function rowHtml(r, aheadIndex) {
            const wait = aheadIndex != null ? aheadIndex * 12 : 0;
            return `
    <div class="ticket-row">
      <div class="left">
        <span class="ticket-no">${r.ticket_no}</span>
        <div>
          <div class="patient-name">${r.name}</div>
          <div class="patient-age">${r.age}y</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="wait-est">~${wait}m</span>
        <button class="call-btn" onclick="callPatient(${r.id}, '${r.ticket_no}', '${r.department}')">🔊 Call</button>
      </div>
    </div>`;
        }

        // ---------- Bilingual voice announcement ----------
        function speakOnce(text, langCode) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.lang = langCode;
                utterance.onend = resolve;
                utterance.onerror = resolve;
                window.speechSynthesis.speak(utterance);
            });
        }

        async function speakTicket(ticketNo, deptCode) {
            if (!document.getElementById('voiceToggle').checked) return;
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();

            // Only speak the numeric part of the ticket (e.g. "305" from "S-GEN-305") —
            // the letters/dashes are for staff/screen reference, not meant to be spoken.
            const numericMatch = ticketNo.match(/\d+/g);
            const spokenNumber = numericMatch ? numericMatch[numericMatch.length - 1].split('').join(' ') : ticketNo;

            const deptEn = DEPT_LABELS_EN[deptCode] || deptCode;
            const deptAr = DEPT_LABELS_AR[deptCode] || deptCode;

            await speakOnce(`Ticket number ${spokenNumber}. Please proceed to ${deptEn}.`, 'en-US');
            await speakOnce(`تذكرة رقم ${spokenNumber}. الرجاء التوجه إلى قسم ${deptAr}.`, 'ar-SA');
        }
        async function callPatient(id, ticketNo, deptCode) {
            speakTicket(ticketNo, deptCode);
            await fetch(`/api/queue/${id}/call`, { method: 'POST' });
            loadQueue();
        }

        async function loadAlerts() {
            const res = await fetch('/api/alerts');
            const rows = await res.json();
            const bar = document.getElementById('alertsBar');
            const list = document.getElementById('alertsList');
            if (rows.length === 0) { bar.classList.remove('show'); return; }
            bar.classList.add('show');
            list.innerHTML = rows.slice(0, 5).map(r => `
    <div class="alert-chip">
      <b>${r.ticket_no}</b><span>${r.name} — ${r.age}y</span>
      <button class="ack-btn" onclick="resolveAlert(${r.id})">Acknowledge</button>
    </div>
  `).join('');
        }

        async function resolveAlert(id) {
            await fetch(`/api/alerts/${id}/resolve`, { method: 'POST' });
            loadAlerts();
        }

        async function loadPrediction() {
            const res = await fetch('/api/predict-peak');
            const data = await res.json();
            const box = document.getElementById('predictBox');
            if (!data.hourly_breakdown || data.hourly_breakdown.length === 0) {
                box.textContent = 'Not enough data yet for a peak-hour forecast.'; return;
            }
            box.innerHTML = `
    <span><span class="label">Busiest hour</span><br><b>${data.busiest_hour}:00</b></span>
    <span><span class="label">Recommended off-peak</span><br><b>${data.recommended_offpeak_hour}:00</b></span>`;
        }

        loadDepartments().then(loadQueue);
        loadAlerts();
        loadPrediction();
        setInterval(loadQueue, 5000);
        setInterval(loadAlerts, 5000);
        setInterval(loadPrediction, 15000);
    </script>
</body>

</html>
